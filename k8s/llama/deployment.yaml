apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llama
spec:
  serviceName: llama
  replicas: 1
  selector:
    matchLabels:
      app: llama
  template:
    metadata:
      labels:
        app: llama
    spec:
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server-b11429
          command: ["/bin/sh", "-c"]
          args:
            - 'cd /models && sha256sum -c checksums.sha256 && exec /app/llama-server "$@"'
            - '--'
            - --model
            - /models/weights/gemma-4-31B-it-Q4_K_M.gguf
            - --mmproj
            - /models/weights/mmproj-F16.gguf
            - --lora
            - /models/gemma-4-31b-protokoll-f16.gguf
            - --lora-init-without-apply
            - --alias
            - gemma-4-31b
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "16384"
            - --parallel
            - "1"
            - --gpu-layers
            - "0"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --flash-attn
            - "on"
            - --image-max-tokens
            - "1120"
            - --cache-ram
            - "0"
            - --jinja
            - --reasoning-budget
            - "0"
            - --no-context-shift
            - --sleep-idle-seconds
            - "30"
            - --batch-size
            - "256"
            - --ubatch-size
            - "128"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 64Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llama
spec:
  selector:
    app: llama
  ports:
    - port: 8080
      targetPort: 8080
