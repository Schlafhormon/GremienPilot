# Docker Compose override for GPU deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requirements:
# - NVIDIA GPU
# - NVIDIA Container Toolkit (nvidia-docker2)
# - Docker configured to use nvidia runtime

services:
  backend:
    image: ${BACKEND_GPU_IMAGE:-ghcr.io/aihpi/pilotproject-protokollierungsassistenz/backend:gpu-latest}
    environment:
      # Allow CPU transcription when the LLM needs the available VRAM.
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - LLM_GPU_LAYERS=${LLM_GPU_LAYERS:-12}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-600}
      - LLM_LOAD_TIMEOUT_SECONDS=${LLM_LOAD_TIMEOUT_SECONDS:-3600}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llama:
    image: ${LLAMA_GPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b11429}
    environment:
      - LLM_GPU_LAYERS=${LLM_GPU_LAYERS:-12}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
